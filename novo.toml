[package]
name        = "arrow-nv"
version     = "0.1.0"
description = "The Apache Arrow columnar format as values: the schema with every logical type, the buffer layout per type, a record batch whose buffers are spans into one body the caller owns, and the IPC stream and file formats as a feed-and-drain reader and a writer into a caller's cursor.  Nothing is copied on the way in and nothing is performed."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `core`.  A record batch is bytes the caller already holds plus the
# arithmetic that says where each column is inside them, and that
# arithmetic performs nothing: no file is opened, no memory is mapped,
# no clock is read.  The IPC reader is a feed-and-drain state machine
# and the writer fills a `Cursor` the caller sized.
#
# There is no microcontroller build: a schema is a tree of boxed structs
# with strings in it, and a batch is a growable list of arrays.
layer       = "core"

category    = "encoding"

tags        = ["arrow", "columnar", "record-batch", "ipc", "flatbuffers", "zero-copy", "dataframe", "sans-io"]
repository  = "https://github.com/novolang/arrow-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.14.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A column is a span into bytes you already hold"

[dependencies]
# calendar-nv, for the temporal logical types.  Arrow stores a date as a
# day count and a timestamp as a count since the epoch, and `arrowtime`
# turns those integers into calendar-nv's civil dates and times.  No
# clock, instant or timezone database is taken: a timestamp's zone is a
# string this package carries unread.
calendar-nv = "^0.2.0"

# dataframe-nv is not a dependency.  It is a consumer of this format, so
# the conversion is declared as `arrowdf`'s two traits, which a data
# frame implements, and the edge back would close a cycle.
